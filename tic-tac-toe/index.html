<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    color:white;
    background:
        radial-gradient(circle at 20% 20%,#4c1d95,transparent 35%),
        radial-gradient(circle at 80% 80%,#075985,transparent 35%),
        #050816;
}

.container{
    width:100%;
    max-width:430px;
    text-align:center;
}

h1{
    font-size:45px;
    margin-bottom:8px;
    background:linear-gradient(90deg,#a78bfa,#38bdf8,#34d399);
    -webkit-background-clip:text;
    color:transparent;
}

.subtitle{
    color:#aeb7ca;
    margin-bottom:30px;
}

/* MODE SCREEN */

#modeScreen{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
    padding:25px;
    border-radius:22px;
    backdrop-filter:blur(15px);
}

#modeScreen h2{
    margin-bottom:20px;
}

.mode{
    width:100%;
    padding:18px;
    margin:8px 0;
    border:none;
    border-radius:15px;
    background:rgba(255,255,255,.08);
    color:white;
    cursor:pointer;
    text-align:left;
    transition:.2s;
    border:1px solid rgba(255,255,255,.08);
}

.mode:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,.14);
}

.mode strong{
    display:block;
    font-size:18px;
    margin-bottom:5px;
}

.mode small{
    color:#aeb7ca;
}

.start{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:14px;
    background:linear-gradient(90deg,#7c3aed,#2563eb);
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

/* GAME */

#gameScreen{
    display:none;
}

.status{
    margin:15px 0 20px;
    font-size:19px;
    font-weight:bold;
}

.board{
    width:min(90vw,380px);
    height:min(90vw,380px);
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.cell{
    border:none;
    border-radius:18px;
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.1);
    color:white;
    font-size:clamp(45px,15vw,75px);
    font-weight:900;
    cursor:pointer;
    transition:.15s;
}

.cell:active{
    transform:scale(.94);
}

.cell.x{
    color:#60a5fa;
}

.cell.o{
    color:#f472b6;
}

.cell.win{
    background:#16a34a;
    color:white;
}

.restart{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:none;
    border-radius:14px;
    background:rgba(255,255,255,.1);
    color:white;
    font-size:16px;
    cursor:pointer;
}

/* POPUP */

.popup-bg{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(7px);
    justify-content:center;
    align-items:center;
    z-index:100;
}

.popup{
    width:90%;
    max-width:350px;
    padding:30px 25px;
    border-radius:25px;
    text-align:center;
    background:#111827;
    border:1px solid rgba(255,255,255,.15);
    box-shadow:0 20px 70px rgba(0,0,0,.6);
    animation:popup .25s ease;
}

@keyframes popup{
    from{
        transform:scale(.7);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.popup .emoji{
    font-size:55px;
    margin-bottom:10px;
}

.popup h2{
    font-size:28px;
    margin-bottom:8px;
}

.popup p{
    color:#aeb7ca;
    margin-bottom:20px;
}

.popup button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:13px;
    background:linear-gradient(90deg,#7c3aed,#2563eb);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

/* SCORE */

.score{
    display:flex;
    justify-content:space-around;
    margin-top:20px;
    padding:14px;
    border-radius:15px;
    background:rgba(255,255,255,.06);
}

.score div{
    color:#cbd5e1;
}

.score span{
    display:block;
    color:white;
    font-size:22px;
    font-weight:bold;
    margin-top:4px;
}

.change-mode{
    margin-top:12px;
    background:none;
    border:none;
    color:#8b5cf6;
    cursor:pointer;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>⭕ Tic Tac Toe</h1>

<p class="subtitle">
Choose your game mode
</p>


<!-- MODE SELECTION -->

<div id="modeScreen">

    <h2>🎮 Select Mode</h2>

    <button class="mode" onclick="selectMode('bot')" id="botOption">
        <strong>🤖 Single Player</strong>
        <small>Play against the Bot</small>
    </button>

    <button class="mode" onclick="selectMode('two')" id="twoOption">
        <strong>👥 Multiplayer</strong>
        <small>2 players on the same mobile</small>
    </button>

    <button class="start" onclick="startGame()">
        ▶ Start Game
    </button>

</div>


<!-- GAME -->

<div id="gameScreen">

    <div id="status" class="status">
        Your Turn — X
    </div>

    <div id="board" class="board"></div>

    <div class="score">

        <div>
            X Wins
            <span id="xScore">0</span>
        </div>

        <div>
            Draws
            <span id="drawScore">0</span>
        </div>

        <div>
            O Wins
            <span id="oScore">0</span>
        </div>

    </div>

    <button class="restart" onclick="newGame()">
        🔄 Restart
    </button>

    <button class="change-mode" onclick="changeMode()">
        ⚙ Change Game Mode
    </button>

</div>

</div>


<!-- RESULT POPUP -->

<div id="popupBg" class="popup-bg">

    <div class="popup">

        <div id="popupEmoji" class="emoji">
            🎉
        </div>

        <h2 id="popupTitle">
            X Wins!
        </h2>

        <p id="popupText">
            Great game!
        </p>

        <button onclick="closePopupAndRestart()">
            ▶ New Game
        </button>

    </div>

</div>


<script>

let board = [
    "","","",
    "","","",
    "","",""
];

let currentPlayer = "X";
let gameOver = false;
let selectedMode = null;

let xScore = 0;
let oScore = 0;
let drawScore = 0;


const winningLines = [

    [0,1,2],
    [3,4,5],
    [6,7,8],

    [0,3,6],
    [1,4,7],
    [2,5,8],

    [0,4,8],
    [2,4,6]

];


const boardElement =
    document.getElementById("board");

const statusElement =
    document.getElementById("status");


/* SELECT MODE */

function selectMode(mode){

    selectedMode = mode;

    document.getElementById("botOption").style.border =
        mode === "bot"
        ? "2px solid #8b5cf6"
        : "1px solid rgba(255,255,255,.08)";

    document.getElementById("twoOption").style.border =
        mode === "two"
        ? "2px solid #8b5cf6"
        : "1px solid rgba(255,255,255,.08)";
}


/* START */

function startGame(){

    if(!selectedMode){

        alert("Please select a game mode first!");

        return;
    }

    document.getElementById("modeScreen").style.display =
        "none";

    document.getElementById("gameScreen").style.display =
        "block";

    newGame();
}


/* NEW GAME */

function newGame(){

    board = [
        "","","",
        "","","",
        "","",""
    ];

    currentPlayer = "X";
    gameOver = false;

    createBoard();
    updateStatus();
}


/* BOARD */

function createBoard(){

    boardElement.innerHTML = "";

    board.forEach((value,index)=>{

        const cell =
            document.createElement("button");

        cell.className = "cell";

        cell.textContent = value;

        if(value === "X")
            cell.classList.add("x");

        if(value === "O")
            cell.classList.add("o");

        cell.onclick =
            () => playerMove(index);

        boardElement.appendChild(cell);

    });
}


/* PLAYER MOVE */

function playerMove(index){

    if(gameOver)
        return;

    if(board[index] !== "")
        return;

    if(
        selectedMode === "bot" &&
        currentPlayer === "O"
    )
        return;

    board[index] = currentPlayer;

    createBoard();

    if(checkGame())
        return;

    currentPlayer =
        currentPlayer === "X"
        ? "O"
        : "X";

    updateStatus();

    if(
        selectedMode === "bot" &&
        currentPlayer === "O"
    ){

        setTimeout(botMove,350);

    }
}


/* BOT */

function botMove(){

    if(gameOver)
        return;

    const move = findBestMove();

    if(move === -1)
        return;

    board[move] = "O";

    createBoard();

    if(checkGame())
        return;

    currentPlayer = "X";

    updateStatus();
}


/* BOT AI */

function findBestMove(){

    /* WIN */

    for(let i=0;i<9;i++){

        if(board[i] === ""){

            board[i] = "O";

            if(getWinner() === "O"){

                board[i] = "";

                return i;
            }

            board[i] = "";
        }
    }


    /* BLOCK */

    for(let i=0;i<9;i++){

        if(board[i] === ""){

            board[i] = "X";

            if(getWinner() === "X"){

                board[i] = "";

                return i;
            }

            board[i] = "";
        }
    }


    /* CENTER */

    if(board[4] === "")
        return 4;


    /* CORNERS */

    const corners =
        [0,2,6,8]
        .filter(i => board[i] === "");

    if(corners.length){

        return corners[
            Math.floor(
                Math.random() * corners.length
            )
        ];

    }


    /* ANY */

    const available =
        board
        .map((v,i)=>v === "" ? i : -1)
        .filter(i=>i !== -1);

    if(available.length){

        return available[
            Math.floor(
                Math.random() * available.length
            )
        ];
    }

    return -1;
}


/* WINNER */

function getWinner(){

    for(const line of winningLines){

        const [a,b,c] = line;

        if(
            board[a] &&
            board[a] === board[b] &&
            board[a] === board[c]
        ){

            return board[a];
        }
    }

    return null;
}


/* CHECK GAME */

function checkGame(){

    const winner = getWinner();

    if(winner){

        gameOver = true;

        if(winner === "X")
            xScore++;
        else
            oScore++;

        updateScore();

        highlightWinner(winner);

        showResult(
            winner === "X"
            ? "🎉"
            : "🏆",
            winner + " Wins!",
            winner === "X"
            ? "Congratulations!"
            : "Great game!"
        );

        return true;
    }


    if(!board.includes("")){

        gameOver = true;

        drawScore++;

        updateScore();

        showResult(
            "🤝",
            "It's a Draw!",
            "Nobody wins this round."
        );

        return true;
    }

    return false;
}


/* HIGHLIGHT */

function highlightWinner(winner){

    const cells =
        document.querySelectorAll(".cell");

    winningLines.forEach(line=>{

        const [a,b,c] = line;

        if(
            board[a] === winner &&
            board[b] === winner &&
            board[c] === winner
        ){

            cells[a].classList.add("win");
            cells[b].classList.add("win");
            cells[c].classList.add("win");

        }

    });
}


/* STATUS */

function updateStatus(){

    if(selectedMode === "bot"){

        statusElement.textContent =
            currentPlayer === "X"
            ? "Your Turn — X"
            : "Bot's Turn — O";

    }else{

        statusElement.textContent =
            currentPlayer === "X"
            ? "Player 1 — X's Turn"
            : "Player 2 — O's Turn";

    }
}


/* POPUP */

function showResult(emoji,title,text){

    document.getElementById("popupEmoji")
        .textContent = emoji;

    document.getElementById("popupTitle")
        .textContent = title;

    document.getElementById("popupText")
        .textContent = text;

    document.getElementById("popupBg")
        .style.display = "flex";
}


/* CLOSE POPUP + AUTO NEW GAME */

function closePopupAndRestart(){

    document.getElementById("popupBg")
        .style.display = "none";

    /*
       Same selected mode stays active.
       New game starts automatically.
    */

    newGame();
}


/* CHANGE MODE */

function changeMode(){

    document.getElementById("gameScreen")
        .style.display = "none";

    document.getElementById("modeScreen")
        .style.display = "block";

    selectedMode = null;

    document.getElementById("botOption").style.border =
        "1px solid rgba(255,255,255,.08)";

    document.getElementById("twoOption").style.border =
        "1px solid rgba(255,255,255,.08)";
}


/* SCORE */

function updateScore(){

    document.getElementById("xScore")
        .textContent = xScore;

    document.getElementById("oScore")
        .textContent = oScore;

    document.getElementById("drawScore")
        .textContent = drawScore;
}

</script>

</body>
  </html>
